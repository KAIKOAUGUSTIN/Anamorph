[pytest]
# The repo is not installed as a package, so its modules are only importable
# if the repo root is on sys.path. Pytest puts it there when invoked with no
# path argument, and *not* when invoked as `pytest tests/test_x.py` - which
# meant the suite passed one way and failed to import the other. This makes it
# explicit instead of a property of how someone happened to type the command.
pythonpath = .

# Only affects runs that ask for a report at all, which is CI's. The default
# `xunit2` drops the `file` and `line` attributes, and without them a failure
# with no usable traceback - a collection error, an import that blew up -
# has nowhere to put its annotation.
junit_family = xunit1
