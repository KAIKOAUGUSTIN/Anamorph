[pytest]
# The repo is not installed as a package, so `pm` is only importable if the
# repo root is on sys.path. Pytest puts it there when invoked with no path
# argument, and *not* when invoked as `pytest tests/test_x.py` - which meant
# the suite passed one way and failed to import the other. This makes it
# explicit instead of a property of how someone happened to type the command.
pythonpath = .
