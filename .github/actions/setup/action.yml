name: Set up Python and Qt
description: >
  Python 3.12, the project's dependencies, and the system libraries PySide6
  needs. Shared because the test matrix runs one job per suite and this would
  otherwise be copied a couple of dozen times.

inputs:
  opengl:
    description: >
      Also install xvfb and a software OpenGL rasteriser, for the tests that
      need a real GL context.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        # numpy>=2.5.1 in requirements.txt has no build below 3.12.
        python-version: "3.12"
        cache: pip

    - name: Install Qt runtime libraries
      # PySide6 wheels ship Qt but not its system dependencies; without these,
      # importing QtGui fails on libEGL before any test runs. Linux only:
      # the Windows and macOS wheels are self-contained.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
          libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
          libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render-util0 libxcb-shape0

    - name: Install a software OpenGL stack
      # xvfb gives Qt a real X display; the Mesa DRI drivers give it a
      # rasteriser, since a CI runner has no GPU.
      if: inputs.opengl == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends \
          xvfb libgl1-mesa-dri libglx-mesa0

    - name: Install dependencies
      # `--only-binary :all:` refuses source distributions, and with them the
      # arbitrary `setup.py` a compromised release could run inside CI. Every
      # dependency here publishes wheels, so the flag costs nothing and the
      # install fails loudly rather than quietly building from source the day
      # one of them stops.
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary :all: -r requirements.txt
        pip install --only-binary :all: "pytest>=7"
