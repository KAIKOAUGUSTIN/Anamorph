name: Version

# Every merge to `main` is a candidate release. The tag this pushes is what
# `release.yml` builds from, so the two stay separate: this one decides what
# the version is, that one produces the artifacts.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One at a time, and never cancelled. Two merges landing close together would
# otherwise have both runs read the same last tag, compute the same next
# version, and race to claim it - the loser failing on a tag that already
# exists, or on a branch that moved under it. Queuing costs a minute; getting
# it wrong costs a version number that means nothing.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  tag:
    # The job pushes a commit to `main`, which would arrive back here as
    # another push. GitHub does not re-trigger for a token-authored push by
    # default, and the subject check makes that independent of the setting.
    if: "!startsWith(github.event.head_commit.message, 'Release v')"
    runs-on: ubuntu-latest
    permissions:
      # `contents` pushes the release branch and the tag; `pull-requests`
      # opens the one that carries the changelog back to `main`.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the script finds the previous tag and reads
          # every commit since it, and a shallow clone has neither.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide the version and write the changelog
        id: decide
        env:
          # Absent secrets disable the call rather than fail it, so a fork or
          # a repository without the key still cuts releases from markers.
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python .github/scripts/next_release.py

      - name: Tag it, and propose the changelog
        if: steps.decide.outputs.release == 'yes'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
          VERSION: ${{ steps.decide.outputs.version }}
          # A personal access token if one is configured, the job's own token
          # otherwise. This is not a preference: GitHub refuses to start a
          # workflow from an event created with `GITHUB_TOKEN`, to stop a
          # workflow triggering itself forever. So a tag pushed with the job
          # token is a tag `release.yml` never sees, and the release quietly
          # does not happen. A PAT is what makes the tag a real event.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          if [ -n "${{ secrets.RELEASE_TOKEN }}" ]; then
            git remote set-url origin \
              "https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/${{ github.repository }}.git"
          else
            echo "::warning::No RELEASE_TOKEN. The tag will be pushed, but "\
                 "GitHub will not start release.yml from it - run that "\
                 "workflow manually against the tag, or add the secret."
          fi
          git config user.name "Kaio Augusto"
          git config user.email "114446391+KAIKOAUGUSTIN@users.noreply.github.com"

          # `main` is protected, and rightly so: it requires a pull request and
          # seven passing checks. Pushing the release commit straight at it was
          # the original design and the ruleset refused it, which was the
          # ruleset doing its job. So the commit goes to a branch of its own.
          branch="release/$TAG"
          # `-B` rather than `-b`: a previous run that got this far and then
          # failed would otherwise leave a branch name that blocks the retry.
          git checkout -B "$branch"
          git add CHANGELOG.md about.py
          git commit -m "Release $TAG"
          git push origin "$branch"

          # The tag points at *that* commit rather than at `main`, so the
          # binary built from it reports the version it was released as. A tag
          # whose about.py still said the old number would put a lie in the
          # About box, which is the one thing this repository will not ship.
          git tag -a "$TAG" -m "Anamorph $VERSION"
          git push origin "$TAG"

          # The changelog reaches `main` the way everything else does.
          #
          # This is allowed to fail the job. The first version swallowed the
          # error with `|| echo`, and the run went green while no pull request
          # existed - the changelog sitting on a branch nobody was told about.
          # A step that reports success when its work did not happen is worse
          # than one that fails.
          #
          # If it fails with a permissions error, the repository setting
          # "Allow GitHub Actions to create and approve pull requests"
          # (Settings -> Actions -> General) is off. It is off by default.
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "::notice::A pull request for $branch already exists."
          else
            gh pr create --base main --head "$branch" \
              --title "Release $TAG" \
              --body "Changelog and version bump for \`$TAG\`. Merging this brings \`CHANGELOG.md\` and \`about.VERSION\` onto \`main\`."
          fi

      - name: Say what happened
        if: always()
        run: |
          {
            echo "## Version"
            if [ "${{ steps.decide.outputs.release }}" = "yes" ]; then
              echo "Tagged **${{ steps.decide.outputs.tag }}** "
              echo "(\`${{ steps.decide.outputs.bump }}\` bump). "
              echo "\`release.yml\` is building it now."
            else
              echo "Nothing to release: no commits since the last tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
