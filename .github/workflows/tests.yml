name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One job per operating system, not per test file. A failing test is named
  # by its annotation - file, test, line, message, on the diff itself - which
  # is a better signal than a job called "masks", and it is the only shape
  # that survives adding a second platform: 25 suites times three systems
  # would be 75 jobs for one push.
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: "does this break on
      # Windows only?" is exactly the question the matrix exists to answer.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # Add `windows-latest` and `macos-latest` here to cover them. Both
          # need a shakedown run first - the suite has never been executed on
          # either, and path handling and the OpenCV video fixture are where
          # it would show.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: pytest
        # conftest.py pins QT_QPA_PLATFORM=offscreen, so no display is needed.
        # No --maxfail: a run that stops at the first failure hides whether
        # anything else is also broken, which is the whole point of reporting.
        run: pytest -q --junitxml=report.xml

      - name: Run one suite by path
        # A different sys.path setup from the bare `pytest` above: the repo is
        # not an installed package, and pytest only puts the root on the path
        # itself when invoked with no path argument. The suite once passed one
        # way while failing to import the other, so CI uses both forms.
        if: always()
        run: pytest tests/test_homography.py -q

      - name: Report failures
        # `always()`, because this is most needed on the run where pytest just
        # failed the job.
        if: always()
        run: python .github/scripts/test_report.py report.xml "tests (${{ matrix.os }})"

  render:
    # The pixel tests skip on the `offscreen` platform, so without this job
    # they never ran in CI at all - the output pass could break and every
    # green tick would still say the suite passed.
    name: render_gl (OpenGL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          opengl: "true"

      - name: Run the pixel tests
        # One run, and the guard reads its output: a missing GL library makes
        # every test skip, and a skipped pixel suite is a green tick that
        # proves nothing.
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a pytest tests/test_render_gl.py -q --junitxml=report.xml | tee result.txt
          grep -qE "[0-9]+ passed" result.txt
          if grep -qE "[0-9]+ skipped" result.txt; then
            echo "::error::The pixel tests skipped - there is no usable GL context here."
            exit 1
          fi

      - name: Report failures
        if: always()
        run: python .github/scripts/test_report.py report.xml "render_gl (OpenGL)"
