name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # numpy>=2.5.1 in requirements.txt has no build below 3.12.
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries
        # PySide6 wheels ship Qt but not its system dependencies; without
        # these, importing QtGui fails on libEGL before any test runs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # conftest.py pins QT_QPA_PLATFORM=offscreen, so no display is needed.
        run: pytest -q
