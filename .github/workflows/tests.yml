name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # One job per test file, so a red tick names the area rather than saying
  # "the suite". The list is read from the repository instead of written out
  # here: a new suite that CI silently ignored would be worse than no split.
  discover:
    name: list suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.list.outputs.suites }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        run: |
          suites=$(ls tests/test_*.py \
            | grep -v 'test_render_gl\.py' \
            | xargs -n1 basename \
            | sed 's/^test_//; s/\.py$//' \
            | jq -R . | jq -sc .)
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "Suites: $suites"

  suite:
    name: ${{ matrix.suite }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first red suite cancels the rest and the run says
      # nothing about whether anything else is also broken.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover.outputs.suites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: pytest tests/test_${{ matrix.suite }}.py
        # conftest.py pins QT_QPA_PLATFORM=offscreen, so no display is needed.
        run: pytest tests/test_${{ matrix.suite }}.py -q

  whole-suite:
    # The split runs every file with a path argument. This one runs pytest
    # with none, which is a different sys.path setup - the repo is not an
    # installed package, and the suite once passed one way while failing to
    # import the other. Keeping both invocation forms in CI is what stops
    # that from coming back quietly.
    name: whole suite (no path argument)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - run: pytest -q

  render:
    # The pixel tests skip on the `offscreen` platform, so without this job
    # they never ran in CI at all - the output pass could break and every
    # green tick would still say the suite passed.
    name: render_gl (OpenGL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          opengl: "true"

      - name: Run the pixel tests
        # One run, and the guard reads its output: a missing GL library makes
        # every test skip, and a skipped pixel suite is a green tick that
        # proves nothing.
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a pytest tests/test_render_gl.py -q | tee result.txt
          grep -qE "[0-9]+ passed" result.txt
          if grep -qE "[0-9]+ skipped" result.txt; then
            echo "::error::The pixel tests skipped - there is no usable GL context here."
            exit 1
          fi
